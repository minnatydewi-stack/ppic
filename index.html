<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Rekap Produksi</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏭</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>📊 Dashboard Rekap Produksi</h1>
      <div class="subtitle" id="last-updated">Memuat...</div>
    </div>
    <div class="header-controls">
      <select id="month-select"></select>
      <button id="refresh-btn">↻ Refresh Data</button>
    </div>
  </header>

  <nav id="category-nav"></nav>

  <main>
    <h2 id="view-title">Ringkasan</h2>
    <div id="status-box" class="status-box hidden"></div>

    <div id="kpi-cards" class="kpi-cards"></div>

    <section class="card-section">
      <div class="card-section-header">
        <h2>📅 Kalender Produksi Harian</h2>
        <select id="metric-select"></select>
      </div>
      <div id="calendar-grid"></div>
      <div id="day-detail" class="hidden"></div>
    </section>

    <section class="card-section">
      <div class="card-section-header">
        <h2>📈 Tren Harian</h2>
      </div>
      <div class="chart-wrap">
        <canvas id="trend-chart"></canvas>
      </div>
    </section>

    <section id="monthly-recap-section" class="card-section">
      <div class="card-section-header">
        <h2>🗂️ Rekap Bulanan per Kategori</h2>
      </div>
      <div id="monthly-recap" class="monthly-recap-grid"></div>
    </section>

    <section class="card-section">
      <div class="card-section-header">
        <h2>📋 Data Lengkap</h2>
      </div>
      <div id="data-table"></div>
    </section>
  </main>

  <footer class="app-footer">
    Data diambil langsung (real-time) dari Google Sheets. Dibuat untuk kebutuhan monitoring produksi harian.
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
